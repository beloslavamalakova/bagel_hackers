<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
 <title id="title">Club Minuit, Paris</title><desc id="desc">A midnight blue nightclub with violet spotlights, a DJ booth, dancers and an amber-lit lounge bar.</desc>
 <defs>
  <linearGradient id="room" x2="0" y2="1"><stop stop-color="#121222"/><stop offset=".65" stop-color="#25223f"/><stop offset="1" stop-color="#111724"/></linearGradient>
  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#29213c"/><stop offset="1" stop-color="#111722"/></linearGradient>
  <linearGradient id="beam" x2="0" y2="1"><stop stop-color="#ab87ee" stop-opacity=".28"/><stop offset="1" stop-color="#ab87ee" stop-opacity="0"/></linearGradient>
  <linearGradient id="pinkbeam" x2="0" y2="1"><stop stop-color="#e68fac" stop-opacity=".23"/><stop offset="1" stop-color="#e68fac" stop-opacity="0"/></linearGradient>
  <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#f0b56b"/><stop offset="1" stop-color="#a97956"/></linearGradient>
  <radialGradient id="haze"><stop stop-color="#8c69b9" stop-opacity=".3"/><stop offset="1" stop-color="#8c69b9" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="acoustic" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 0v32" stroke="#615273" stroke-opacity=".18" stroke-width="2"/></pattern>
  <g id="bottle"><rect x="0" y="0" width="12" height="40" rx="3" fill="#75969b"/><path d="M4 0v-12h4V0" fill="#96afb0"/><rect x="2" y="15" width="8" height="13" fill="#d8b692"/></g>
  <g id="dancer"><ellipse cy="128" rx="32" ry="7" fill="#080e1a" opacity=".4"/><circle cy="-15" r="16" fill="#b68c81"/><path d="M-15 0q15-8 30 0l12 57-51 0Z" fill="currentColor"/><path d="m-10 55-12 65m30-65 18 64" stroke="#151827" stroke-width="14" stroke-linecap="round"/><path d="m-14 8-25-19-11-25M14 9l29 14 14-24" fill="none" stroke="#b68c81" stroke-width="9" stroke-linecap="round"/></g>
 </defs>
 <style>
  .light{transform-box:fill-box;transform-origin:50% 0;animation:sweep 14s ease-in-out infinite alternate}.light.second{animation-delay:-7s;animation-duration:19s}.dance{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.8s ease-in-out infinite alternate}.dance.other{animation-delay:-1.7s;animation-duration:4.7s}
  @keyframes sweep{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}@media(prefers-reduced-motion:reduce){.light,.dance{animation:none}}
 </style>
