<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100"><defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#141327"/><stop offset=".7" stop-color="#2c2347"/><stop offset="1" stop-color="#4a2f52"/></linearGradient>
