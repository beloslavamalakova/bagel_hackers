 <linearGradient id="facade" x2="0" y2="1"><stop stop-color="#1c1a26"/><stop offset="1" stop-color="#0f0e15"/></linearGradient>
 <radialGradient id="doorGlow" cx=".5" cy=".55" r=".6"><stop stop-color="#c04bd0" stop-opacity=".85"/><stop offset=".55" stop-color="#7a2a9a" stop-opacity=".45"/><stop offset="1" stop-color="#2b1640" stop-opacity="0"/></radialGradient>
